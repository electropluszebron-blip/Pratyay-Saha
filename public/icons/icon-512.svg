<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B2213"/>
      <stop offset="50%" stop-color="#5A1208"/>
      <stop offset="100%" stop-color="#1E0A06"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE58F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#D4AF37" stroke-width="8"/>
  
  <!-- Intricate Celestial Mandala Sun Circles -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
  
  <!-- 16 Sacred Terracotta Lotus Petals -->
  <g transform="translate(256, 256)" stroke="url(#goldGrad)" fill="rgba(212, 175, 55, 0.15)" stroke-width="2">
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(22.5)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(45)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(67.5)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(90)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(112.5)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(135)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(157.5)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(180)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(202.5)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(225)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(247.5)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(270)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(292.5)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(315)" />
    <path d="M0 -150 Q18 -100 0 -50 Q-18 -100 0 -150" transform="rotate(337.5)" />
  </g>

  <!-- Open Sacred Manuscript Book -->
  <g transform="translate(146, 176)" fill="#FCFAF5" stroke="url(#goldGrad)" stroke-width="4" filter="url(#goldGlow)">
    <!-- Left Leaf -->
    <path d="M110 135 C70 120 20 125 0 140 L0 20 C20 10 70 5 110 20 Z" />
    <!-- Right Leaf -->
    <path d="M110 135 C150 120 200 125 220 140 L220 20 C200 10 150 5 110 20 Z" />
    <!-- Center Spine -->
    <line x1="110" y1="20" x2="110" y2="135" stroke="#B93826" stroke-width="4"/>
    <!-- Text Lines on Pages -->
    <line x1="20" y1="45" x2="90" y2="45" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
    <line x1="20" y1="65" x2="90" y2="65" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
    <line x1="20" y1="85" x2="90" y2="85" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
    <line x1="20" y1="105" x2="70" y2="105" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
    
    <line x1="130" y1="45" x2="200" y2="45" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
    <line x1="130" y1="65" x2="200" y2="65" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
    <line x1="130" y1="85" x2="200" y2="85" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
    <line x1="130" y1="105" x2="180" y2="105" stroke="#B93826" stroke-width="2.5" opacity="0.6"/>
  </g>

  <!-- Luminous Sacred Flame (Jyoti) above Manuscript -->
  <g transform="translate(256, 150)">
    <path d="M0 -30 C12 -15 14 0 0 15 C-14 0 -12 -15 0 -30 Z" fill="#FFE58F" filter="url(#goldGlow)"/>
    <path d="M0 -18 C6 -8 8 0 0 8 C-8 0 -6 -8 0 -18 Z" fill="#B93826"/>
  </g>

  <!-- Royal Title Monogram -->
  <text x="256" y="380" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="4">
    WILTING OF WORDS
  </text>
  <text x="256" y="415" font-family="'Cinzel', Georgia, serif" font-size="16" font-weight="700" fill="#FFE58F" text-anchor="middle" letter-spacing="6" opacity="0.9">
    PRATYAY SAHA
  </text>
</svg>
